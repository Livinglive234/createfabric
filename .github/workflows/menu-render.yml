name: Verify Create menu rendering
on:
  push:
    branches: [codex/fix-datagen-stable]
    paths:
      - '.github/workflows/menu-render.yml'
      - 'scripts/install_menu_render_probe.py'
      - 'src/main/java/com/simibubi/create/infrastructure/gui/CreateMainMenuScreen.java'
      - 'src/main/java/com/simibubi/create/foundation/mixin/fabric/RenderTargetMixin.java'
      - 'src/main/java/com/simibubi/create/content/kinetics/simpleRelays/BracketedKineticBlockModel.java'
  workflow_dispatch:
jobs:
  screenshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Install software renderer
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri libasound2t64 libflite1
      - name: Install temporary screenshot probe
        run: python3 scripts/install_menu_render_probe.py
      - name: Capture menu variants
        run: |
          timeout 360 xvfb-run -a -s "-screen 0 1280x720x24" env LIBGL_ALWAYS_SOFTWARE=1 ./gradlew runClient --console=plain
          test -s build/menu-smoke/title.png
          test -s build/menu-smoke/modmenu.png
      - name: Upload screenshots and client logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: menu-render
          path: |
            build/menu-smoke/
            run/logs/
            run/crash-reports/
